services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    env_file:
      - .env.example
    environment:
      CLAUDE_SEO_WEB_AUTO_WORKER: "0"
      CLAUDE_SEO_WEB_DATA: /data
      CLAUDE_SEO_WEB_ORIGINS: http://127.0.0.1:8001,http://localhost:8001
    ports:
      - "8001:8001"
    volumes:
      - claude_seo_web_data:/data

  worker:
    build:
      context: ..
      dockerfile: web/Dockerfile
    env_file:
      - .env.example
    environment:
      CLAUDE_SEO_WEB_AUTO_WORKER: "0"
      CLAUDE_SEO_WEB_DATA: /data
    command: ["python", "-m", "web.worker"]
    volumes:
      - claude_seo_web_data:/data

volumes:
  claude_seo_web_data:
